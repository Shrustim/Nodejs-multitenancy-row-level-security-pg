services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tenant_practice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_admin_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tenant_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_practice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tenant_pg_data:
